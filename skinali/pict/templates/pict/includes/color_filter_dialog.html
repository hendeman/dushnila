<dialog class="mobile-filter-dialog"
        id="mobile-color-filter"
        aria-labelledby="mobile-color-filter-title">
  <div class="mobile-filter-dialog__content">
    <header class="mobile-filter-dialog__header">
      <h2 id="mobile-color-filter-title">Цвета</h2>
      <button type="button"
              class="mobile-filter-dialog__close"
              data-mobile-filter-close
              aria-label="Закрыть список цветов">&times;</button>
    </header>
    <form class="mobile-color-filter__form"
          action="{{ color_reset_url }}"
          method="get"
          data-mobile-color-form
          data-max-colors="{{ max_catalog_colors }}">
      <div class="mobile-filter-dialog__hint mobile-color-filter__header">
        <p>Можно выбрать до {{ max_catalog_colors }} цветов. После выбора нажмите кнопку «Применить цвета».</p>
        <div class="mobile-color-filter__actions">
          <button type="submit" class="mobile-color-filter__apply">Применить цвета</button>
        </div>
      </div>
      <ul class="mobile-filter-dialog__list">
        <li>
          <button type="button"
                  class="mobile-filter-dialog__item mobile-filter-dialog__item--button{% if not selected_color_slugs %} is-selected{% endif %}"
                  data-mobile-color-clear
                  {% if not selected_color_slugs %}aria-current="true"{% endif %}>
            <span>Все цвета</span>
            <span class="mobile-filter-dialog__check"
                  data-mobile-color-all-check
                  aria-hidden="true"
                  {% if selected_color_slugs %}hidden{% endif %}>&#10003;</span>
          </button>
        </li>
        {% for option in color_options %}
          <li>
            <label class="mobile-filter-dialog__item mobile-filter-dialog__item--color{% if option.is_selected %} is-selected{% elif not option.can_toggle %} is-disabled{% endif %}">
              <input class="mobile-color-filter__checkbox"
                     type="checkbox"
                     name="color"
                     value="{{ option.color.slug_color }}"
                     data-mobile-color-checkbox
                     {% if option.is_selected %}checked{% elif not option.can_toggle %}disabled{% endif %}>
              <span class="mobile-filter-dialog__color-name">
                <span class="mobile-filter-dialog__swatch" style="background-color: {{ option.color.slug_color }};" aria-hidden="true"></span>
                <span>{{ option.color }}</span>
              </span>
              <span class="mobile-filter-dialog__check"
                    data-mobile-color-check
                    aria-hidden="true"
                    {% if not option.is_selected %}hidden{% endif %}>&#10003;</span>
            </label>
          </li>
        {% endfor %}
      </ul>
    </form>
  </div>
  {% include 'pict/includes/mobile_filter_scroll_button.html' %}
</dialog>
